name: build

# 什么时候跑：
#   - 推 tag（v0.1.0 这种）→ 编译 + 建 Release 挂 exe
#   - 推 main → 只编译，产物留在 Actions 页面可下载
#   - 手动在 Actions 页点 "Run workflow" → 同上
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc
  # 静态链接 CRT：产物不依赖 vcruntime140.dll，拿到别的机器上直接能跑。
  # 注意 target-feature 只有在显式 --target 时才生效，所以下面 build 一定带 --target。
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 cargo 依赖与增量产物
        uses: Swatinem/rust-cache@v2
        with:
          # 把 RUSTFLAGS 的影响算进缓存 key，避免换编译参数后吃到旧缓存
          key: crt-static

      - name: 编译
        run: cargo build --release --locked --target $env:TARGET

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = "target/$env:TARGET/release/tgvd.exe"
          if (-not (Test-Path $src)) { throw "构建产物不存在: $src" }
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '^refs/tags/v', '' } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $dst = "dist/TGVD-$ver-windows-x64.exe"
          Copy-Item $src $dst
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 2)
          "产物: $dst  ($mb MB)"
          if ($mb -lt 3) { throw "体积异常，可能构建不完整" }
          # Windows 上单文件 exe 不依赖 vcruntime，这里只是把版本信息记进 step summary
          "TGVD $ver · Windows x64 · $mb MB" >> $env:GITHUB_STEP_SUMMARY

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgvd-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 建 Release 并挂上 exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            Windows x64 单文件版，解压即用，无需安装 .NET / VC++ 运行库。

            首次启动在「设置」里填 Telegram api_id / api_hash，然后按提示登录。
            登录凭证保存在 `%APPDATA%\TGVD\tgvd.session`，不会上传到任何地方。
